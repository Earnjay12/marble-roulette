<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Marble Roulette 마블룰렛</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="57x57" href="assets/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="assets/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="assets/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="assets/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="assets/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="assets/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/manifest.json">

  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="assets/ms-icon-144x144.png">
  <meta name="theme-color" content="#000000">

  <meta name="description" content="구슬을 굴려 당첨자를 뽑는 추첨기">
  <meta property="og:title" content="마블룰렛">
  <meta property="og:description" content="구슬을 굴려 당첨자를 뽑는 추첨기">
  <meta property="og:type" content="website">

  <link rel='stylesheet' href='assets/style.scss' />
</head>
<body>
<script type="module" src="./src/index.ts"></script>
<script type="text/javascript">
  function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map(v => v.trim()).filter(v => !!v);
  }

  function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
    const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
    const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
    return {
      name,
      weight,
      count,
    };
  }

  function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    localStorage.setItem('mbr_names', names.join(','));
    applyWinnerSetting();
  }

  // 구슬 수가 바뀔 때마다 다시 호출된다. 범위 클리핑은 roulette이 하고, 잘린 결과를 input에 되돌려 쓴다.
  // edited는 사용자가 방금 고친 범위 input('start' | 'end')
  function applyWinnerSetting(edited) {
    const rankInput = document.querySelector('#in_winningRank');
    const startInput = document.querySelector('#in_rangeStart');
    const endInput = document.querySelector('#in_rangeEnd');

    let start;
    let end;
    switch (winnerType) {
      case 'first':
        start = end = 1;
        break;
      case 'last':
        start = end = window.roulette.getCount();
        break;
      case 'multi':
        start = parseInt(startInput.value, 10) || 1;
        end = parseInt(endInput.value, 10) || 1;
        // 뒤집힌 범위는 방금 고친 쪽을 존중하고 반대쪽을 따라오게 한다
        if (end < start) {
          if (edited === 'end') {
            start = end;
          } else {
            end = start;
          }
        }
        break;
      default:
        start = end = parseInt(rankInput.value, 10) || 1;
    }

    window.roulette.setWinnerRange(start - 1, end - 1);
    const clipped = window.roulette.getWinnerRange();
    // 범위 input은 여러명 모드일 때만 건드린다. 다른 모드가 덮어쓰면 사용자가 넣어둔 범위가 날아간다
    if (winnerType === 'multi') {
      startInput.value = clipped.start + 1;
      endInput.value = clipped.end + 1;
    } else {
      rankInput.value = clipped.start + 1;
    }

    document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
    document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
    document.querySelector('.btn-multi-winner').classList.toggle('active', winnerType === 'multi');
    rankInput.classList.toggle('active', winnerType === 'custom');
    document.querySelector('.row-range').classList.toggle('active', winnerType === 'multi');
  }

  function selectWinnerType(type, edited) {
    winnerType = type;
    applyWinnerSetting(edited);
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }


  let ready = false;
  let winnerType = 'first';

  document.addEventListener('DOMContentLoaded', () => {
    initialize();
  });

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
      console.log('does not loaded yet');
      setTimeout(initialize, 100);
      return;
    }
    console.log('initializing start');

    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');

    if (namesFromUrl) {
      document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    } else {
      const savedNames = localStorage.getItem('mbr_names');
      if (savedNames) {
        document.querySelector('#in_names').value = savedNames;
      }
    }
    document.querySelector('#in_names').addEventListener('input', () => {
      getReady();
    });

    document.querySelector('#in_names').addEventListener('blur', () => {
      const nameSource = getNames();
      const nameSet = new Set();
      const nameCounts = {};
      nameSource.forEach(nameSrc => {
        const name = parseName(nameSrc);
        const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
        if (!nameSet.has(key)) {
          nameSet.add(key);
          nameCounts[key] = 0;
        }
        nameCounts[key] += name.count;
      });
      const result = [];
      Object.keys(nameCounts).forEach(key => {
        if (nameCounts[key] > 1) {
          result.push(`${key}*${nameCounts[key]}`);
        } else {
          result.push(key);
        }
      });

      const oldValue = document.querySelector('#in_names').value;
      const newValue = result.join(',');

      if (oldValue !== newValue) {
        document.querySelector('#in_names').value = newValue;
        getReady();
      }
    });

    document.querySelector('#btnShuffle').addEventListener('click', () => {
      getReady();
    });

    document.querySelector('#btnStart').addEventListener('click', () => {
      if (!ready) return;
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    });

    document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
      window.options.autoRecording = e.target.matches(':checked');
      window.roulette.setAutoRecording(window.options.autoRecording);
    });

    // 스킬 모드: 없음 / 기본(폭발만) / 능력(구슬마다 고유 스킬)
    const applySkillMode = (mode) => {
      window.options.skillMode = mode;
      localStorage.setItem('mbr_skill', mode);
      document.querySelectorAll('.btn-skill').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.skill === mode);
      });
      const abilityMode = mode === 'rpg' || mode === 'mono';
      document.querySelector('#btnAbilities').classList.toggle('visible', abilityMode);
      document.querySelector('.row-pack').classList.toggle('active', abilityMode);
      window.roulette.refreshAbilities();
    };
    document.querySelectorAll('.btn-skill').forEach((btn) => {
      btn.addEventListener('click', () => applySkillMode(btn.dataset.skill));
    });

    // 스킬 팩: 일반 / 애니(캐릭터 기술). 능력·모노전투에서만 보인다
    const applyPack = (pack) => {
      window.options.skillPack = pack;
      localStorage.setItem('mbr_pack', pack);
      document.querySelectorAll('.btn-pack').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.pack === pack);
      });
      window.roulette.refreshAbilities();
    };
    document.querySelectorAll('.btn-pack').forEach((btn) => {
      btn.addEventListener('click', () => applyPack(btn.dataset.pack));
    });
    applyPack(localStorage.getItem('mbr_pack') === 'anime' ? 'anime' : 'general');
    applySkillMode(localStorage.getItem('mbr_skill') || 'basic');

    // 능력표 창: 스킬 설명과 구슬별 배정 결과
    const renderAbilities = () => {
      document.querySelector('#abilityLegend').innerHTML = window.roulette
        .getSkillList()
        .map((s) => `<li>${s.svg}<b>${s.name}</b><span class="desc">${s.description}</span></li>`)
        .join('');
      // 배당표: 한 줄에 구슬 하나. 색 점·이름 | 배지·스킬 이름 | 설명
      document.querySelector('#abilityList').innerHTML = window.roulette
        .getMarbleAbilities()
        .map(
          (m) =>
            `<li><span class="dot" style="background: hsl(${m.hue} 100% 60%)"></span>` +
            `<span class="nm">${escapeHtml(m.name)}</span>${m.svg}<span class="sk">${m.skillName}</span>` +
            `<span class="desc">${m.description}</span></li>`
        )
        .join('');
    };
    const abilitiesModal = document.querySelector('#abilities');
    abilitiesModal.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        abilitiesModal.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
        abilitiesModal.querySelectorAll('.tab-page').forEach((p) => {
          p.classList.toggle('active', p.dataset.page === tab.dataset.tab);
        });
      });
    });
    document.querySelector('#btnAbilities').addEventListener('click', () => {
      renderAbilities();
      abilitiesModal.classList.add('open');
    });
    document.querySelector('#closeAbilities').addEventListener('click', () => abilitiesModal.classList.remove('open'));
    abilitiesModal.addEventListener('click', (e) => {
      if (e.target === abilitiesModal) abilitiesModal.classList.remove('open');
    });

    // 테마
    const applyTheme = (name) => {
      window.roulette.setTheme(name);
      document.documentElement.dataset.theme = name;
      localStorage.setItem('mbr_theme', name);
    };
    const themeSelect = document.querySelector('#sltTheme');
    const savedTheme = localStorage.getItem('mbr_theme');
    themeSelect.value = [...themeSelect.options].some((o) => o.value === savedTheme) ? savedTheme : 'dark';
    applyTheme(themeSelect.value);
    themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));

    document.querySelector('#in_winningRank').addEventListener('change', () => selectWinnerType('custom'));
    document.querySelector('.btn-last-winner').addEventListener('click', () => selectWinnerType('last'));
    document.querySelector('.btn-first-winner').addEventListener('click', () => selectWinnerType('first'));
    document.querySelector('.btn-multi-winner').addEventListener('click', () => selectWinnerType('multi'));
    document.querySelector('#in_rangeStart').addEventListener('change', () => selectWinnerType('multi', 'start'));
    document.querySelector('#in_rangeEnd').addEventListener('change', () => selectWinnerType('multi', 'end'));

    window.roulette.addEventListener('goal', () => {
      ready = false;
      setTimeout(() => {
        document.querySelector('#settings').classList.remove('hide');
      }, 3000);
    });

    window.roulette.addEventListener('message', (e) => {
      simpleToast(e.detail);
    });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent =
        collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    document.querySelector('#btnShuffle').click();

    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    maps.forEach((map) => {
      const option = document.createElement('option');
      option.value = map.index;
      option.innerHTML = map.title;
      option.setAttribute('data-trans', '');
      window.translateElement(option);
      mapSelector.append(option);
    });
    mapSelector.addEventListener('change', (e) => {
      window.roulette.setMap(e.target.value);
      // setMap은 살아남은 구슬에서 이름을 뽑아 재구성한다. 골인한 구슬이 사라지고
      // 무게(/n)도 날아가므로, 원본인 이름 입력창에서 다시 채운다
      getReady();
    });

    function simpleToast(msg) {
      const toast = document.createElement('div');
      toast.classList.add('toast');
      toast.innerHTML = msg;

      if (window.translateElement) {
        console.log('try to translate');
        window.translateElement(toast);
      }

      document.body.appendChild(toast);
      setTimeout(() => {
        document.body.removeChild(toast);
      }, 1200);
    }

  }
</script>
<h1 class="sr-only">Marble Roulette - 랜덤 추첨기</h1>
<div id="settings" class="settings">
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings">
      <span data-trans>Settings</span>
      <i class="toggle-arrow">▲</i>
    </button>
    <div class="collapsible-rows collapsed">
      <div class="row">
        <label for='sltMap'>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id="sltMap"></select>
      </div>
      <div class="row row-toggles">
        <div class='toggle-item'>
          <label for='chkAutoRecording'>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type="checkbox" id="chkAutoRecording" />
        </div>
      </div>
      <div class="row row-skill">
        <label>
          <i class="icon bomb"></i>
          <span data-trans>Skills</span>
        </label>
        <div class="btn-group">
          <button class="btn-skill" data-skill="none" data-trans>None</button>
          <button class="btn-skill active" data-skill="basic" data-trans>Basic</button>
          <button class="btn-skill" data-skill="rpg" data-trans>Abilities</button>
          <button class="btn-skill" data-skill="mono" data-trans>Mono battle</button>
        </div>
      </div>
      <div class="row row-pack">
        <label>
          <i class="icon play"></i>
          <span data-trans>Skill pack</span>
        </label>
        <div class="btn-group">
          <button class="btn-pack active" data-pack="general" data-trans>General</button>
          <button class="btn-pack" data-pack="anime" data-trans>Anime</button>
        </div>
      </div>
      <div class="row">
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class="btn-group">
          <button class="btn-winner btn-first-winner active" data-trans>First</button>
          <button class="btn-winner btn-last-winner" data-trans>Last</button>
          <input type="number" id="in_winningRank" value="1" min="1" />
          <button class="btn-winner btn-multi-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type="number" id="in_rangeStart" value="1" min="1" />
          <span class="range-sep">~</span>
          <input type="number" id="in_rangeEnd" value="3" min="1" />
        </div>
      </div>
      <div class="row row-theme">
        <label for='sltTheme'>
          <i class="icon sun"></i>
          <span data-trans>Theme</span>
        </label>
        <select id="sltTheme">
          <option value="dark" data-trans>Classic</option>
          <option value="pinball" data-trans>Pinball</option>
        </select>
      </div>
    </div>
  </div>
  <div class="left">
    <h3 data-trans>Enter names below</h3>
    <textarea id="in_names" placeholder="Input names separated by commas or line feed here" data-trans="placeholder">수박*2,키위*2,귤*2</textarea>
    <div class="actions">
      <button id="btnAbilities" class="btn-abilities" data-trans>List</button>
      <div class="sep"></div>
      <button id="btnShuffle">
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id="btnStart">
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<div id="abilities" class="modal">
  <div class="modal-panel">
    <h2 data-trans>Marble abilities</h2>
    <div class="modal-tabs">
      <button class="tab active" data-tab="assign" data-trans>Assignments</button>
      <button class="tab" data-tab="guide" data-trans>Skill guide</button>
    </div>
    <div class="modal-body">
      <ul id="abilityList" class="assign-list tab-page active" data-page="assign"></ul>
      <ul id="abilityLegend" class="legend tab-page" data-page="guide"></ul>
    </div>
    <div class="modal-action">
      <button id="closeAbilities" data-trans>Close</button>
    </div>
  </div>
</div>
<div class="copyright">&copy; 2022-2026. <a href="https://github.com/lazygyu/roulette" target="_blank">lazygyu</a> (MIT)</div>
</body>
</html>
